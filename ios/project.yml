# sokudoku の iOS アプリの Xcode プロジェクト定義。Sokudoku.xcodeproj と各 target の Info.plist はこのファイルから xcodegen で生成し、リポジトリには入れない (make ios-project)
name: Sokudoku
options:
  bundleIdPrefix: com.bannzai
  # システムの部品 (貼り付けボタン等) の文言を日本語で出すため。英語の画面はまだ作っていない
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
packages:
  SokudokuCore:
    path: SokudokuCore
# アプリと共有の拡張で揃える必要がある設定 (拡張の版はアプリの版と同じでないと Xcode が警告する)
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    # bannzai の Apple Developer Program のチーム。実機向けのビルド (fastlane beta) で、アプリと共有の拡張の両方の自動署名に使う
    DEVELOPMENT_TEAM: TQPN82UBBY
targets:
  Sokudoku:
    type: application
    platform: iOS
    sources: [Sokudoku, Shared]
    dependencies:
      - package: SokudokuCore
      - target: SokudokuShare
    info:
      path: Sokudoku/Info.plist
      properties:
        # 共有の拡張からアプリを開く URL (Shared/SharedImport.swift の sharedImportURLScheme)
        CFBundleURLTypes:
          - CFBundleURLName: com.bannzai.sokudoku.import
            CFBundleURLSchemes: [sokudoku]
        # URL からの取り込みに使う Worker (worker/) のオリジン。空のビルドでは URL の入口を出さない
        SokudokuExtractURL: $(SOKUDOKU_EXTRACT_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bannzai.sokudoku
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: sokudoku
        # 独自の暗号化を使わないため、アップロードのたびに App Store Connect で輸出コンプライアンスを回答しなくて済むよう申告しておく。
        # 通信は SOKUDOKU_EXTRACT_URL を渡したビルドの URL からの取り込みだけで、OS の HTTPS (URLSession) を使う
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Worker はまだ配信の URL が決まっていない (deploy-worker.yml は Cloudflare の Secrets の登録待ち) ため空にする。
        # make build-ios SOKUDOKU_EXTRACT_URL=<Worker のオリジン> で渡せる (Web 版の NEXT_PUBLIC_EXTRACT_URL と同じ扱い)
        SOKUDOKU_EXTRACT_URL: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SokudokuShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: sokudoku
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Safari 等のページの URL 1 つか、選択した文字列を受ける
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bannzai.sokudoku.share
        GENERATE_INFOPLIST_FILE: YES
